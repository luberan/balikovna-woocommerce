name: Release Please

on:
  push:
    branches: [main]
  # GITHUB_TOKEN merges do not emit another workflow-triggering push.
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose missing ZIP should be built
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main' && inputs.release_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # Release PRs are merged manually, so the user-generated merge event
          # starts the tag/release run without a broad personal access token.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Configuration is read from .release-please-config.json and
          # .release-please-manifest.json in the repo root.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Find the open release pull request, including unchanged retries
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: release-please--branches--main--components--balikovna-woocommerce
        run: |
          set -e
          pr=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f base=main -f "head=$GITHUB_REPOSITORY_OWNER:$RELEASE_BRANCH" \
            --jq 'if length > 1 then error("Multiple release PRs found") else .[] | "number=\(.number)\nbranch=\(.head.ref)" end')
          if [ -z "$pr" ]; then
            echo "No open release PR needs preparation"
          else
            printf '%s\n' "$pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out trusted release tooling
        if: steps.release-pr.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: tooling
          persist-credentials: false

      - name: Check out release pull request
        if: steps.release-pr.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          path: release

      - name: Setup PHP for release preparation
        if: steps.release-pr.outputs.number != ''
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Prepare changelog inside the release pull request
        if: steps.release-pr.outputs.number != ''
        working-directory: release
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          set -e
          php ../tooling/.github/scripts/normalize-changelog.php CHANGELOG.md
          php ../tooling/.github/scripts/changelog-to-readme.php CHANGELOG.md readme.txt
          if git diff --quiet -- CHANGELOG.md readme.txt; then
            echo "Release changelog is already in sync"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add CHANGELOG.md readme.txt
            git commit -m "chore: prepare release changelog"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi

      - name: Explain manual approval of the prepared release pull request
        if: steps.release-pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.release-pr.outputs.number }}
        run: |
          printf '## Release PR #%s\n\n' "$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          printf '[Open release PR](%s/%s/pull/%s)\n\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo 'Select **Approve workflows to run** on the prepared release PR, wait for **CI result**, then squash-merge the PR manually.' \
            >> "$GITHUB_STEP_SUMMARY"

  build-zip:
    name: Build plugin ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release-please
    if: always() && github.ref == 'refs/heads/main' && (needs.release-please.outputs.release_created == 'true' || inputs.release_tag != '')
    # A third-party action prepares PHP here, so this job cannot write to the
    # repository, its releases or its attestations.
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release-please job has already pushed a tag and updated the
          # working files. Check out that tag explicitly so the ZIP contains
          # the bumped version, not the pre-bump main.
          ref: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
          path: source
          persist-credentials: false

      - name: Check out current build tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: tooling
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: zip
          coverage: none

      - name: Build plugin ZIP
        run: php tooling/.github/scripts/build-plugin.php source

      - name: Hand the ZIP to the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-zip
          path: source/build/balikovna-woocommerce.zip
          if-no-files-found: error
          retention-days: 7

  publish-zip:
    name: Attach plugin ZIP and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-please, build-zip]
    if: always() && needs.build-zip.result == 'success'
    # Write access is limited to first-party GitHub actions and the gh CLI.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Receive the built ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip
          path: artifact

      - name: Attest the provenance of the ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifact/balikovna-woocommerce.zip

      # release-please creates the release as a draft, so sites are offered
      # the update only once the ZIP is attached.
      - name: Attach the ZIP and publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: |
          set -e
          # A retry after an interrupted publication finds the ZIP already
          # attached: reuse it when it is the same file, never replace it.
          built="sha256:$(sha256sum artifact/balikovna-woocommerce.zip | cut -d ' ' -f 1)"
          attached=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name == "balikovna-woocommerce.zip") | .digest // "unknown"')
          if [ -z "$attached" ]; then
            gh release upload "$RELEASE_TAG" artifact/balikovna-woocommerce.zip \
              --repo "$GITHUB_REPOSITORY"
          elif [ "$attached" = "$built" ]; then
            echo "The same ZIP is already attached to $RELEASE_TAG."
          else
            echo "::error::$RELEASE_TAG already has a different balikovna-woocommerce.zip ($attached, built $built). Re-run the failed job of the run that attached it, or remove the asset from the draft."
            exit 1
          fi
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi
