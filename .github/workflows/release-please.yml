name: Release Please

on:
  push:
    branches: [main]
  # Manual trigger for cases where release-please merged its own PR but the
  # resulting merge commit didn't trigger a fresh `push` event (GitHub's
  # anti-loop protection: events from GITHUB_TOKEN don't trigger workflows).
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose missing ZIP should be built
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: inputs.release_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # Release PRs are merged manually, so the user-generated merge event
          # starts the tag/release run without a broad personal access token.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Configuration is read from .release-please-config.json and
          # .release-please-manifest.json in the repo root.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # NOTE: Release PRs are NOT auto-merged. Custom git+PAT merging bypasses
      # GitHub's PR "merged" state, which release-please requires to create
      # the tag/release — leading to an infinite loop of new release PRs.
      # Merge the release PR manually in the GitHub UI (squash & merge).

  build-zip:
    name: Build plugin ZIP and attach to release
    runs-on: ubuntu-latest
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || inputs.release_tag != '')
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release-please job has already pushed a tag and updated the
          # working files. Check out that tag explicitly so the ZIP contains
          # the bumped version, not the pre-bump main.
          ref: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
          path: source

      - name: Check out current build tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: tooling

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Build plugin ZIP
        run: |
          PLUGIN_SLUG="balikovna-woocommerce"
          if [ -f source/CHANGELOG.md ]; then
            php tooling/.github/scripts/normalize-changelog.php source/CHANGELOG.md
          fi
          php tooling/.github/scripts/build-plugin.php source

          # Replace the static '== Changelog ==' section in readme.txt with
          # the full history converted from CHANGELOG.md (managed by
          # release-please). Plugin Update Checker reads this section and
          # displays it under "View version details" in WP admin.
          if [ -f source/CHANGELOG.md ]; then
            php tooling/.github/scripts/changelog-to-readme.php \
              source/CHANGELOG.md "source/build/${PLUGIN_SLUG}/readme.txt"
          fi

          cd source/build
          rm -f "${PLUGIN_SLUG}.zip"
          zip -r "${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"
          ls -la

      - name: Upload ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" "source/build/balikovna-woocommerce.zip"

      - name: Sync readme.txt changelog back to main
        if: needs.release-please.outputs.release_created == 'true'
        working-directory: tooling
        # Plugin Update Checker fetches readme.txt from the main branch (not
        # from the installed ZIP) to render "View version details" in WP
        # admin. Without this commit, users would always see only v1.0.0
        # changelog in WP admin even though the ZIP itself has full history.
        run: |
          set -e
          # The tooling checkout tracks main; update it in case another commit
          # landed while the release asset was being built.
          git pull --ff-only origin main

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md missing on main, nothing to sync"
            exit 0
          fi

          php .github/scripts/changelog-to-readme.php \
            CHANGELOG.md readme.txt

          if git diff --quiet readme.txt; then
            echo "readme.txt is already in sync, nothing to commit"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add readme.txt
          # Prefix MUST be `chore:` (hidden in release-please config) so this
          # commit does NOT trigger another release bump. Using `docs:` would
          # cause an infinite release loop because release-please treats it
          # as a bump-worthy change.
          git commit -m "chore: sync readme.txt changelog with ${{ needs.release-please.outputs.tag_name }} [skip ci]"
          git push origin main
