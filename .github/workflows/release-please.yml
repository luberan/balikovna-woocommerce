name: Release Please

on:
  push:
    branches: [main]
  # Manual trigger for cases where release-please merged its own PR but the
  # resulting merge commit didn't trigger a fresh `push` event (GitHub's
  # anti-loop protection: events from GITHUB_TOKEN don't trigger workflows).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Use a PAT so events created by this action (PR merges, tag pushes)
          # DO trigger subsequent workflow runs. With the default GITHUB_TOKEN,
          # the merge commit of the release PR wouldn't re-run this workflow,
          # which is the step that creates the tag/release.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Configuration is read from .release-please-config.json and
          # .release-please-manifest.json in the repo root.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # Squash-merge the release PR right away by performing a git merge with
      # the PAT (not via `gh pr merge`, which produces a commit attributed to
      # the GitHub web UI bot and therefore re-hits the anti-loop). Pushing
      # with the PAT identity DOES trigger a fresh workflow run, which then
      # publishes the GitHub Release and runs build-zip.
      - name: Auto-merge release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -e
          PR_NUMBER=$(echo '${{ steps.release.outputs.pr }}' | jq -r '.number')
          PR_BRANCH=$(echo '${{ steps.release.outputs.pr }}' | jq -r '.headBranchName')
          PR_TITLE=$(echo '${{ steps.release.outputs.pr }}' | jq -r '.title')
          echo "Merging release PR #$PR_NUMBER ($PR_BRANCH)"

          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.name 'release-please[bot]'
          git config user.email 'release-please[bot]@users.noreply.github.com'

          git checkout main
          git merge --squash "origin/$PR_BRANCH"
          git commit -m "$PR_TITLE (#$PR_NUMBER)"
          git push origin main

          # Clean up the release branch.
          git push origin --delete "$PR_BRANCH" || true

  build-zip:
    name: Build plugin ZIP and attach to release
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The release-please job has already pushed a tag and updated the
          # working files. Check out that tag explicitly so the ZIP contains
          # the bumped version, not the pre-bump main.
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build plugin ZIP
        run: |
          # Stage the plugin into a folder named exactly like the plugin slug
          # (no version suffix) so WordPress can update it in place.
          PLUGIN_SLUG="balikovna-woocommerce"
          mkdir -p "build/${PLUGIN_SLUG}"

          rsync -a \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/.gitignore' \
            --exclude='/.release-please-config.json' \
            --exclude='/.release-please-manifest.json' \
            --exclude='/build' \
            --exclude='/node_modules' \
            --exclude='/vendor' \
            --exclude='/tests' \
            --exclude='/CONTRIBUTING.md' \
            --exclude='/SECURITY.md' \
            --exclude='/CHANGELOG.md' \
            --exclude='/Balikovna.postman_collection.json' \
            --exclude='*.zip' \
            ./ "build/${PLUGIN_SLUG}/"

          # Sanity check: bundled PUC's vendor/ (Parsedown) MUST be included.
          test -f "build/${PLUGIN_SLUG}/includes/lib/plugin-update-checker/vendor/Parsedown.php" \
            || (echo "::error::Parsedown.php missing from ZIP" && exit 1)

          # Replace the static '== Changelog ==' section in readme.txt with
          # the full history converted from CHANGELOG.md (managed by
          # release-please). Plugin Update Checker reads this section and
          # displays it under "View version details" in WP admin.
          if [ -f CHANGELOG.md ]; then
            python3 .github/scripts/changelog-to-readme.py \
              CHANGELOG.md "build/${PLUGIN_SLUG}/readme.txt"
          fi

          cd build
          zip -r "${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"
          ls -la

      - name: Upload ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "build/balikovna-woocommerce.zip" --clobber

      - name: Sync readme.txt changelog back to main
        # Plugin Update Checker fetches readme.txt from the main branch (not
        # from the installed ZIP) to render "View version details" in WP
        # admin. Without this commit, users would always see only v1.0.0
        # changelog in WP admin even though the ZIP itself has full history.
        run: |
          set -e
          # Re-check out main so we commit on top of the latest state
          # (release-please has already pushed its bump commit).
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md missing on main, nothing to sync"
            exit 0
          fi

          python3 .github/scripts/changelog-to-readme.py \
            CHANGELOG.md readme.txt

          if git diff --quiet readme.txt; then
            echo "readme.txt is already in sync, nothing to commit"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add readme.txt
          # Prefix MUST be `chore:` (hidden in release-please config) so this
          # commit does NOT trigger another release bump. Using `docs:` would
          # cause an infinite release loop because release-please treats it
          # as a bump-worthy change.
          git commit -m "chore: sync readme.txt changelog with ${{ needs.release-please.outputs.tag_name }} [skip ci]"
          git push origin main
