name: Composer security audit

on:
  workflow_dispatch:
  schedule:
    - cron: '11 7 * * *'

permissions:
  contents: read

concurrency:
  group: composer-security-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none
      - name: Validate committed dependencies
        run: composer validate --strict
      - name: Audit locked dependencies including development tools
        run: composer audit --locked
