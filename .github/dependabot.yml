version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:17"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:17"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 5
    # Framework stubs must match the pinned integration profiles and metadata.
    ignore:
      - dependency-name: "php-stubs/*"
    groups:
      composer-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:17"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
